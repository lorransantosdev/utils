# Counts skill downloads once a day and commits the numbers (stats/, skills/STATS.md).
name: Skill download stats
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats skills/STATS.md
          if ! git diff --cached --quiet; then git commit -m "Update download stats" && git push; fi
