# Attaches a skill's zip to a release.
# Create a release whose tag is <skill>-v<version> (e.g. city-of-living-data-v2.1.0) in
# Releases → Draft a new release; this workflow zips skills/<skill>/ and attaches it.
name: Release a skill
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. city-of-living-data-v2.0.0
        required: true
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Zip the skill and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          SKILL="${TAG%-v*}"
          test -f "skills/$SKILL/SKILL.md" || { echo "no skills/$SKILL/SKILL.md for tag $TAG"; exit 1; }
          cd skills && zip -qr "../$SKILL.zip" "$SKILL" -x "$SKILL/docs/*" && cd ..
          gh release upload "$TAG" "$SKILL.zip" --clobber
